<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Fact Generator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="https://media.istockphoto.com/id/2155359716/vector/cute-white-cat-peeking-cartoon-vector-illustration.jpg?s=612x612&w=0&k=20&c=8EOUTh5gJ3wSuWH4IjKgvy6LMGKBI2nNWVxjqvPCDcg=" type="image/x-icon">
    <!-- Google fonts CDN -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="top">
            <img src="https://media.istockphoto.com/id/2155359716/vector/cute-white-cat-peeking-cartoon-vector-illustration.jpg?s=612x612&w=0&k=20&c=8EOUTh5gJ3wSuWH4IjKgvy6LMGKBI2nNWVxjqvPCDcg=" alt="Cat Picture" width="120px">
            <h2>Cat Fact Generator</h2>
        </div>
        <div class="middle">
            <p class="fact-text">Click on "Random Fact" Button to generate a random cat fact.</p>
            
            <p class="fact-length">Word count: 0</p>
        </div>
        <div class="bottom">
            <button class="fact-btn">Random Fact</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
